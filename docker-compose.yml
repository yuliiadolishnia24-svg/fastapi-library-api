version: '3.8'

services:
  # Наш mock-сервер Prism (він заміняє нам реальний бекенд для тестів)
  mock-api:
    image: stoplight/prism:5
    container_name: library_prism_mock
    ports:
      - "4010:4010"
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    command: mock -h 0.0.0.0 -p 4010 /openapi.yaml --multiprocess=false
    restart: always

  # Сервіс для навантажувального тестування
  locust:
    image: locustio/locust
    container_name: library_locust
    ports:
      - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py
    depends_on:
      - mock-api  # Тепер Locust знає, що треба чекати на запуск mock-api!
    restart: always