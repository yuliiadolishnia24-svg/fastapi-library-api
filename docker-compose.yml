services:
  db:
    image: postgres:16-alpine
    container_name: library_postgres_db
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: library_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres_admin:password123@db:5432/library_db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: